schema: spec-driven

context: |
  Flowl is a Rust single-crate Axum/SQLx/SQLite/MQTT backend with a SvelteKit frontend
  embedded into the binary and shipped as a small Docker image.

rules:
  design:
    - "Favor simplicity and avoid unnecessary dependencies to preserve the single-binary deployment and small Docker image."
  specs:
    - "Keep capability specs flat at `specs/{domain}-{capability}/spec.md`, using the established `core`, `ui`, `ai`, and `data` domain prefixes; do not create domain subdirectories."
  tasks:
    - "Include a final verification task to run `cargo fmt -- --check`, `cargo clippy -- -D warnings`, `npm run format:check --prefix ui`, `npm run lint --prefix ui`, `npm run check --prefix ui`, and `cargo test`."
